<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index,follow" />
  <title>NGU Trading</title>
  <link rel="canonical" href="https://ngutrading.com/" />
  <link rel="alternate" hreflang="de" href="https://ngutrading.com/de/" />
  <link rel="alternate" hreflang="en" href="https://ngutrading.com/en/" />
  <link rel="alternate" hreflang="x-default" href="https://ngutrading.com/en/" />
  <script>
    (function () {
      var lang = (navigator.language || '').toLowerCase();
      var region = '';
      if (lang.indexOf('-') > -1) region = lang.split('-')[1].toUpperCase();
      var deRegions = ['DE','AT','CH'];
      var isGerman = lang.startsWith('de') || deRegions.indexOf(region) !== -1;
      location.replace(isGerman ? '/de/' : '/en/');
    })();
  </script>
</head>
<body>
  <main>
    <h1>NGU Trading</h1>
    <p>If you are not redirected automatically, choose a language.</p>
    <p><a href="/en/">English</a> · <a href="/de/">Deutsch</a></p>
  </main>
</body>
</html>
