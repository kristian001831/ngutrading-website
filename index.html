<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B8YQBFNWQN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-B8YQBFNWQN');
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>NGU Trading</title>

  <!-- Route app domain to /app/, otherwise use language-based redirect -->
  <script>
    try {
      const host = (location.hostname || "").toLowerCase();
      if (host.includes("ngutrading.app")) {
        location.replace("/app/");
      } else {
        const l = (navigator.language || "").toLowerCase();
        if (!l.startsWith("de")) {
          location.replace("/en/");
        } else {
          location.replace("/de/");
        }
      }
    } catch(e) {}
  </script>
</head>
<body></body>
</html>
