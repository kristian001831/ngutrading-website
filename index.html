<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NGU Trading | Language Redirect</title>
  <meta name="robots" content="noindex,follow">
  <script>
    (function () {
      var lang = (navigator.language || 'en').toLowerCase();
      var target = lang.startsWith('de') ? '/de/' : '/en/';
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>If you are not redirected automatically, continue to <a href="/en/">English</a> or <a href="/de/">Deutsch</a>.</p>
</body>
</html>
